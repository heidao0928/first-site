    <script>
      (function () {
        document.documentElement.classList.add("js");

          var saved = localStorage.getItem("theme");
          var dark = saved

            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";

      })();
    </script>
