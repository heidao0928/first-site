    <script>
      (function () {
        document.documentElement.classList.add("js");
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>

    <script>
      /* 低配 GPU / 国内套壳浏览器（QQ、360、UC 等）关掉玻璃模糊，避免滚动卡顿 */
      (function () {
        var ua = navigator.userAgent || "";
        var weak = /MQQBrowser|QQBrowser|MicroMessenger|UCBrowser|360SE|360EE|HeyTapBrowser/i.test(ua);
        if (!weak && navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) weak = true;
        if (!weak && navigator.deviceMemory && navigator.deviceMemory <= 4) weak = true;
        if (weak || /(\?|&)fast=1/.test(location.search)) document.documentElement.className += " low-gpu";
      })();
    </script>
