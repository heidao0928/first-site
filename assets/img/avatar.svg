<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="头像占位图">
  <defs>
    <radialGradient id="water" cx="35%" cy="18%" r="95%">
      <stop offset="0" stop-color="#e8ffff"/>
      <stop offset="0.28" stop-color="#8ce4f7"/>
      <stop offset="0.62" stop-color="#2ba3c4"/>
      <stop offset="1" stop-color="#053a4f"/>
    </radialGradient>
    <radialGradient id="orb" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#c8f4ff"/>
      <stop offset="0.55" stop-color="#4cc0de"/>
      <stop offset="0.86" stop-color="#0a6f92"/>
      <stop offset="1" stop-color="#04384c"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="320" height="320"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="320" height="320" fill="url(#water)"/>

    <!-- 水面波纹 -->
    <path d="M-20 74c52-26 96 22 150-2s96-24 150 6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M-20 104c56-22 100 20 156-4s92-22 148 8" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>

    <!-- 主体：一颗果冻球 -->
    <circle cx="160" cy="166" r="88" fill="url(#orb)"/>
    <circle cx="160" cy="166" r="88" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>
    <ellipse cx="128" cy="126" rx="34" ry="24" fill="url(#shine)" opacity="0.9" transform="rotate(-28 128 126)"/>
    <path d="M96 214a88 88 0 0 0 128-2" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>

    <!-- Y2K 像素点缀 -->
    <rect x="236" y="64" width="8" height="8" fill="#ffffff" opacity="0.9"/>
    <rect x="252" y="80" width="4" height="4" fill="#ffffff" opacity="0.6"/>
    <rect x="62" y="246" width="8" height="8" fill="#ffffff" opacity="0.55"/>
    <rect x="46" y="230" width="4" height="4" fill="#ffffff" opacity="0.4"/>

    <!-- 气泡 -->
    <circle cx="252" cy="236" r="12" fill="none" stroke="#ffffff" stroke-opacity="0.6"/>
    <circle cx="272" cy="204" r="6" fill="none" stroke="#ffffff" stroke-opacity="0.45"/>
    <circle cx="70" cy="96" r="8" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
  </g>
</svg>
