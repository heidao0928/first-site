name: Deploy to Aliyun OSS

# 推送到 main 就自动同步到阿里云 OSS（香港，无需备案）
# 需要先在仓库 Settings → Secrets and variables → Actions 里加：
#   OSS_ENDPOINT          oss-cn-hongkong.aliyuncs.com
#   OSS_BUCKET            Bucket 名称
#   OSS_ACCESS_KEY_ID     AccessKey ID
#   OSS_ACCESS_KEY_SECRET AccessKey Secret

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_AK: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_SK: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查 Secrets 是否配置
        id: check
        run: |
          if [ -z "$OSS_AK" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::还没配置 OSS Secrets，本次跳过部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: 安装 oss2
        if: steps.check.outputs.skip != 'true'
        run: pip install --quiet oss2

      - name: 上传到 OSS
        if: steps.check.outputs.skip != 'true'
        run: python tools/upload_oss.py
