      /* 低配 GPU / 国内套壳浏览器（QQ、360、UC 等）关掉玻璃模糊，避免滚动卡顿 */
      (function () {
        var ua = navigator.userAgent || "";
        var weak = /MQQBrowser|QQBrowser|MicroMessenger|UCBrowser|360SE|360EE|HeyTapBrowser|Core\/\d/i.test(ua);
        if (!weak && navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) weak = true;
        if (!weak && navigator.deviceMemory && navigator.deviceMemory <= 4) weak = true;
        var m = /[?&]fast=(\d)/.exec(location.search || "");
        var level = m ? Number(m[1]) : 0;
        if (weak || level >= 1) document.documentElement.className += " low-gpu";
        if (level >= 2) document.documentElement.className += " fast2";
        if (level >= 3) document.documentElement.className += " fast3";
      })();
    </script>
